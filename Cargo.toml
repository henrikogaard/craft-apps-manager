[package]
name = "craft-apps-manager"
version = "0.1.8"
edition = "2021"
license = "MIT"
description = "Release and source manager for the Craft apps"
repository = "https://github.com/henrikogaard/craft-apps-manager"
authors = ["Craft Apps Updater contributors", "Henrik Øgård"]
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
libc = "0.2"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = "0.37"
base64 = "0.22"
muda = { version = "0.21", default-features = false }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
