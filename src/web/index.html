<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'"
    />
    <title>Craft Library</title>
    <style>
      @font-face {
        font-family: DM;
        src: url(data:font/ttf;base64,__BODY_FONT__);
      }
      @font-face {
        font-family: Space;
        src: url(data:font/ttf;base64,__DISPLAY_FONT__);
      }
      :root {
        color-scheme: dark;
        --bg: #161616;
        --panel: #202020;
        --raised: #272727;
        --hover: #303030;
        --line: #343434;
        --text: #e9e9e9;
        --muted: #929292;
        --subtle: #676767;
        --button: #ececec;
        --button-text: #181818;
        --shadow: 0 12px 40px #0004;
        --accent: #6aa8ff;
        --ok: #4cc38a;
        --bad: #f2555a;
        --bar: 48px;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #e9e9e9;
        --panel: #fafafa;
        --raised: #f0f0f0;
        --hover: #e5e5e5;
        --line: #d9d9d9;
        --text: #252525;
        --muted: #727272;
        --subtle: #999;
        --button: #252525;
        --button-text: #fff;
        --shadow: 0 12px 40px #0001;
        --accent: #1f6feb;
        --ok: #1a7f4b;
        --bad: #c62a2f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px DM,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: inherit;
        cursor: pointer;
        border-radius: 6px;
        padding: 7px 10px;
        transition: background 0.12s;
      }
      button:hover {
        background: var(--hover);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      .app-card:focus-visible,
      .side-app:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 5px;
      }
      .primary {
        background: var(--button);
        color: var(--button-text);
        font-weight: 600;
        border-color: var(--button);
      }
      .primary:hover {
        opacity: 0.88;
        background: var(--button);
      }
      .secondary {
        border-color: var(--line);
        background: var(--raised);
      }
      .quiet {
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      .tiny {
        font-size: 11px;
        color: var(--muted);
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      #chrome {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 15px 0 86px;
        user-select: none;
      }
      #chrome img {
        width: 25px;
        height: 25px;
        border-radius: 6px;
      }
      #chrome strong {
        font-size: 13px;
        font-weight: 600;
      }
      #drag {
        flex: 1;
        height: 100%;
      }
      .themes {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 2px;
        border-radius: 7px;
        display: flex;
        gap: 2px;
      }
      .themes button {
        padding: 4px 9px;
        font-size: 11px;
        color: var(--muted);
      }
      .themes button.active {
        background: var(--hover);
        color: var(--text);
      }
      #layout {
        height: calc(100vh - 76px);
        display: grid;
        grid-template-columns: 200px minmax(380px, 1fr) 304px;
        gap: 8px;
        padding: 0 10px;
      }
      aside,
      main,
      #inspector {
        background: var(--panel);
        border-radius: 9px;
        overflow: hidden;
        min-width: 0;
      }
      aside {
        display: flex;
        flex-direction: column;
        padding: 0 10px 12px;
      }
      .workspace {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--bar);
        flex-shrink: 0;
        margin: 0 -10px 10px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        font-weight: 600;
      }
      .workspace svg {
        color: var(--muted);
      }
      nav {
        display: grid;
        gap: 3px;
      }
      nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        padding: 9px 10px;
        color: var(--muted);
      }
      nav button.active {
        background: var(--hover);
        color: var(--text);
      }
      nav .count {
        margin-left: auto;
        font-size: 10px;
        color: var(--muted);
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 17px 8px;
      }
      #side-apps {
        overflow: auto;
        flex: 1;
        margin: 8px 0;
      }
      .side-app {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        color: var(--muted);
        padding: 4px 4px 4px 10px;
        min-height: 33px;
        font-size: 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .side-app:hover {
        background: var(--hover);
      }
      .side-app .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .side-app .shortcut {
        font-size: 10px;
        color: var(--subtle);
        padding-right: 6px;
      }
      .side-app .open {
        display: none;
        font-size: 11px;
        padding: 3px 8px;
        border-color: var(--line);
        background: var(--raised);
        color: var(--text);
      }
      .side-app:hover .open,
      .side-app:focus-within .open {
        display: inline-flex;
      }
      .side-app:hover .shortcut,
      .side-app:focus-within .shortcut {
        display: none;
      }
      .update-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex-shrink: 0;
      }
      .side-app.active {
        background: var(--hover);
        color: var(--text);
      }
      .side-app img {
        width: 21px;
        height: 21px;
        border-radius: 5px;
        filter: grayscale(1);
      }
      .sidebar-footer {
        border-top: 1px solid var(--line);
        padding-top: 10px;
        display: grid;
      }
      .sidebar-footer button {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
      }
      main {
        display: flex;
        flex-direction: column;
      }
      .main-top {
        height: var(--bar);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding: 0 10px 0 16px;
        gap: 6px;
      }
      .breadcrumb {
        font-size: 11px;
        color: var(--muted);
        flex: 1;
      }
      .main-top .tab {
        font-size: 12px;
        background: var(--raised);
        padding: 5px 10px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .content {
        overflow: auto;
        padding: 23px 23px 30px;
        flex: 1;
      }
      h1 {
        font:
          600 25px Space,
          DM,
          sans-serif;
        letter-spacing: -0.8px;
        margin: 0 0 7px;
      }
      h2 {
        font:
          600 18px Space,
          DM,
          sans-serif;
        margin: 0 0 6px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      .filters {
        display: flex;
        gap: 7px;
        align-items: center;
        margin: 22px 0 18px;
      }
      .search {
        position: relative;
        flex: 1;
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 10px;
        color: var(--muted);
      }
      input[type="search"] {
        width: 100%;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 9px 9px 32px;
        color: var(--text);
        font-size: 12px;
      }
      select {
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        color: var(--muted);
        max-width: 145px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
        gap: 10px;
      }
      .app-card {
        cursor: pointer;
        padding: 16px 15px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        text-align: left;
        display: flex;
        flex-direction: column;
        min-height: 159px;
        position: relative;
      }
      .app-card:hover {
        background: var(--raised);
        border-color: var(--subtle);
      }
      .app-card.selected {
        border-color: var(--muted);
        background: var(--raised);
      }
      .card-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .app-card img {
        height: 35px;
        width: 35px;
        border-radius: 8px;
        filter: grayscale(1);
        opacity: 0.95;
      }
      .app-card strong {
        font-size: 13px;
        font-weight: 600;
      }
      .category {
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }
      .description {
        font-size: 11.5px;
        line-height: 1.5;
        margin-top: 13px;
        flex: 1;
        color: var(--muted);
      }
      .card-bottom {
        margin-top: 15px;
        padding-top: 9px;
        min-height: 33px;
        gap: 8px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
      }
      .card-bottom svg {
        width: 13px;
        height: 13px;
      }
      .card-bottom .open {
        font-size: 11px;
        padding: 4px 11px;
        border-color: var(--line);
        background: var(--raised);
        color: var(--text);
      }
      .app-card:hover .card-bottom .open {
        background: var(--button);
        color: var(--button-text);
        border-color: var(--button);
      }
      .version-line {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        white-space: nowrap;
      }
      .version-line .new {
        color: var(--accent);
        font-weight: 600;
      }
      .status-dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        background: var(--muted);
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-dot.new {
        background: var(--accent);
      }
      .empty {
        padding: 40px 10px;
        color: var(--muted);
        text-align: center;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 11px;
      }
      #inspector {
        display: flex;
        flex-direction: column;
      }
      .inspector-top {
        display: flex;
        align-items: center;
        gap: 7px;
        height: var(--bar);
        flex-shrink: 0;
        padding: 0 10px 0 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        font-weight: 500;
      }
      .inspector-top .icon-button {
        margin-left: auto;
      }
      .inspector-body {
        padding: 22px 16px;
        overflow: auto;
        flex: 1;
      }
      .detail-heading {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 21px;
      }
      .detail-heading img {
        width: 45px;
        height: 45px;
        border-radius: 10px;
        filter: grayscale(1);
      }
      .detail-heading h2 {
        font-size: 20px;
      }
      .detail-description {
        margin-bottom: 20px;
        font-size: 12px;
      }
      .install-row {
        display: flex;
        gap: 7px;
        margin-bottom: 21px;
      }
      .install-row .primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex: 1;
        padding: 10px;
      }
      .install-row .secondary {
        padding: 10px 15px;
      }
      .install-note {
        font-size: 10px;
        line-height: 1.6;
        margin: -11px 0 21px;
        color: var(--muted);
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        margin: 11px 0;
      }
      .info-row span:first-child {
        color: var(--muted);
      }
      .info-row .new {
        color: var(--accent);
        font-weight: 600;
      }
      .link {
        padding: 0;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .link:hover {
        background: none;
        color: var(--text);
      }
      .updates {
        margin: 20px 0 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        overflow: hidden;
      }
      .updates-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 10px 14px;
        font-size: 12px;
        font-weight: 600;
      }
      .updates-head .update-dot {
        margin-right: 2px;
      }
      .updates-head .summary {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .updates-head .summary span {
        font-weight: 400;
        color: var(--muted);
      }
      .update-row {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        padding: 7px 12px 7px 14px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        cursor: pointer;
      }
      .update-row:hover {
        background: var(--hover);
      }
      .update-row img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        filter: grayscale(1);
      }
      .update-row .versions {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        white-space: nowrap;
      }
      .update-row .versions .new {
        color: var(--accent);
        font-weight: 600;
      }
      .update-row button,
      .updates-head button {
        font-size: 11px;
        padding: 4px 11px;
      }
      .check-all {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 5px 10px;
        border-color: var(--line);
        background: var(--raised);
      }
      .check-all svg {
        width: 14px;
        height: 14px;
      }
      .modal.wide {
        width: 560px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 2px;
        margin: 4px 0 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--raised);
      }
      .tabs button {
        flex: 1;
        font-size: 11px;
        padding: 5px 6px;
        color: var(--muted);
      }
      .tabs button.active {
        background: var(--panel);
        color: var(--text);
      }
      .pane {
        min-height: 300px;
      }
      .field .note {
        display: block;
        margin-top: 2px;
      }
      .usage {
        margin: 14px 0 4px;
      }
      .usage-total {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .usage-total strong {
        color: var(--text);
        font-size: 15px;
      }
      .usage-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 34px;
        padding: 4px 8px;
        font-size: 12px;
        border-radius: 6px;
        overflow: hidden;
      }
      .usage-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--share);
        background: var(--hover);
        z-index: 0;
      }
      .usage-row > :not(.usage-bar) {
        position: relative;
      }
      .usage-label {
        flex: 1;
      }
      .usage-size {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .usage-action {
        width: 112px;
        display: flex;
        justify-content: flex-end;
      }
      .usage-row button {
        font-size: 11px;
        padding: 4px 10px;
      }
      .folder-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: -8px 0 14px;
        font-size: 11px;
      }
      .folder-row .path {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }
      .folder-row button {
        font-size: 11px;
        padding: 4px 10px;
      }
      .run-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        flex-shrink: 0;
      }
      .run-badge {
        margin-left: auto;
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: var(--ok);
        white-space: nowrap;
      }
      .ctx {
        position: fixed;
        z-index: 30;
        min-width: 190px;
        padding: 5px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .ctx-title {
        font-size: 11px;
        color: var(--muted);
        padding: 4px 9px 6px;
      }
      .ctx button {
        display: block;
        width: 100%;
        text-align: left;
        font-size: 12px;
        padding: 6px 9px;
        border-radius: 5px;
      }
      .ctx-rule {
        height: 1px;
        background: var(--line);
        margin: 4px 2px;
      }
      .events {
        margin: 20px 0 10px;
        display: grid;
        gap: 8px;
      }
      .event {
        display: flex;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 12px;
      }
      .event-icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--raised);
        color: var(--ok);
        flex-shrink: 0;
      }
      .event-icon svg {
        width: 12px;
        height: 12px;
        stroke-width: 2.2;
      }
      .event.failed .event-icon {
        color: var(--bad);
      }
      .event-body {
        flex: 1;
        min-width: 0;
      }
      .event-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .event ul {
        margin: 6px 0 0;
        padding-left: 16px;
        color: var(--muted);
        line-height: 1.5;
      }
      .event-error {
        margin-top: 6px;
        color: var(--bad);
        overflow-wrap: anywhere;
      }
      .spinner {
        width: 10px;
        height: 10px;
        border: 2px solid var(--line);
        border-top-color: var(--text);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .log-details {
        margin-top: 18px;
      }
      .notes {
        margin: 18px 0 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .notes summary {
        color: var(--text);
        font-weight: 600;
      }
      .notes ul {
        margin: 8px 0 6px;
        padding-left: 16px;
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--muted);
      }
      .notes li {
        margin: 3px 0;
      }
      .notes .more {
        font-size: 11px;
        color: var(--subtle);
      }
      .build-item .actions {
        flex: 0 1 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: flex-end;
      }
      .build-item .actions button {
        padding: 6px 9px;
      }
      kbd {
        font: 10px DM, sans-serif;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--muted);
      }
      .search kbd {
        position: absolute;
        right: 9px;
        top: 8px;
      }
      .shortcuts {
        margin-top: 18px;
        font-size: 11px;
        color: var(--subtle);
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }
      .section-rule {
        height: 1px;
        background: var(--line);
        margin: 19px 0;
      }
      details {
        margin: 15px 0;
      }
      summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
        list-style: none;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      summary:before {
        content: "›";
        font-size: 16px;
      }
      details[open] summary:before {
        transform: rotate(90deg);
      }
      .detail-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 12px;
      }
      .detail-buttons button {
        font-size: 11px;
      }
      .provenance {
        font:
          10.5px ui-monospace,
          monospace;
        word-break: break-all;
        line-height: 1.7;
        color: var(--muted);
        margin-top: 12px;
      }
      .build-note {
        font-size: 11px;
        margin: 11px 0;
        line-height: 1.6;
        color: var(--muted);
      }
      .right-bottom {
        font-size: 10px;
        padding: 11px 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .right-bottom svg {
        width: 13px;
        height: 13px;
      }
      #status {
        height: 28px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
        color: var(--muted);
        font-size: 10px;
      }
      #status-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .progress {
        height: 3px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
        width: 85px;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--muted);
        width: 40%;
        animation: working 1.7s infinite alternate;
      }
      @keyframes working {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(220%);
        }
      }
      #toast {
        position: fixed;
        bottom: 43px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 650px;
        max-height: 210px;
        overflow: auto;
        background: var(--raised);
        border: 1px solid var(--muted);
        border-radius: 8px;
        padding: 13px 17px;
        box-shadow: var(--shadow);
        font-size: 12px;
        z-index: 15;
        display: none;
      }
      #toast.show {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #toast span {
        flex: 1;
      }
      #toast button {
        padding: 2px 7px;
        color: var(--muted);
      }
      .log {
        font:
          11px ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 15px;
        border-radius: 7px;
        margin-top: 15px;
        min-height: 220px;
        line-height: 1.65;
      }
      .build-item {
        border: 1px solid var(--line);
        padding: 15px;
        border-radius: 7px;
        margin: 10px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .build-item img {
        width: 29px;
        height: 29px;
        filter: grayscale(1);
        border-radius: 6px;
      }
      .build-item > div {
        flex: 1;
      }
      .build-item strong {
        display: block;
        font-size: 12px;
        margin-bottom: 3px;
      }
      .build-item button {
        font-size: 11px;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #0008;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 25px;
        width: 490px;
        max-width: 90vw;
        max-height: 85vh;
        overflow: auto;
        box-shadow: var(--shadow);
      }
      .modal h2 {
        margin-bottom: 10px;
      }
      .modal p {
        font-size: 12px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 23px;
      }
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin: 16px 0;
        font-size: 12px;
      }
      .field input[type="number"] {
        width: 60px;
        background: var(--raised);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 5px;
        padding: 5px;
      }
      .field input[type="text"],
      textarea {
        background: var(--raised);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 5px;
        padding: 7px;
      }
      .selection {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 14px 0;
      }
      .selection label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
      }
      input[type="checkbox"] {
        accent-color: var(--muted);
      }
      textarea {
        width: 100%;
        min-height: 90px;
        font:
          12px ui-monospace,
          monospace;
      }
      .setting-heading {
        font-size: 12px;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        margin-top: 21px;
      }
      .danger {
        color: var(--muted);
      }
      .update-result {
        font-size: 11px;
        margin-top: 12px;
        color: var(--muted);
      }
      @media (max-width: 1050px) {
        #layout {
          grid-template-columns: 170px minmax(300px, 1fr) 272px;
        }
        .content {
          padding: 20px 18px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(140px, 1fr));
        }
        .app-card {
          padding: 13px 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header id="chrome">
      <img src="__MANAGER_ICON__" alt="" /><strong>Craft Library</strong>
      <div id="drag" aria-label="Drag window"></div>
      <div class="themes" aria-label="Appearance">
        <button data-theme="dark" onclick="theme('dark')">Dark</button
        ><button data-theme="light" onclick="theme('light')">Light</button>
      </div>
    </header>
    <div id="layout">
      <aside>
        <div class="workspace">
          <span data-icon="box"></span> Storytold apps
        </div>
        <nav id="nav"></nav>
        <div class="divider"></div>
        <div class="label" style="padding-left: 10px">INSTALLED</div>
        <div id="side-apps"></div>
        <div class="sidebar-footer">
          <button onclick="settings()">
            <span data-icon="settings"></span> Settings</button
          ><button onclick="send('open-library')">
            <span data-icon="folder"></span> Open library folder
          </button>
        </div>
      </aside>
      <main>
        <div class="main-top">
          <span class="tab"
            ><span data-icon="grid"></span
            ><span id="tab-label">All apps</span></span
          ><span class="breadcrumb"></span
          ><button
            class="check-all"
            id="check-updates"
            title="Check every installed app for a newer release. Nothing is downloaded."
            onclick="send('check-updates')"
          >
            <span data-icon="refresh"></span
            ><span id="check-label">Check all</span></button
          ><button
            class="icon-button"
            title="Refresh installed apps"
            aria-label="Refresh installed apps"
            onclick="send('refresh')"
          >
            <span data-icon="refresh"></span>
          </button>
        </div>
        <section class="content" id="content"></section>
      </main>
      <section id="inspector"></section>
    </div>
    <footer id="status">
      <span data-icon="check"></span
      ><span id="status-text">Loading your library…</span>
      <div class="progress" id="progress" hidden><i></i></div>
      <button
        id="cancel"
        hidden
        onclick="send('cancel')"
        style="font-size: 10px; padding: 2px 5px"
      >
        Cancel</button
      ><span id="version"></span
      ><button
        onclick="view('activity')"
        style="font-size: 10px; padding: 2px 5px"
      >
        Activity
      </button>
    </footer>
    <div id="toast" role="alert"></div>
    <div id="modal-root"></div>
    <div id="ctx" class="ctx" role="menu" hidden></div>
    <script>
      const catalog = __CATALOG__;
      let state = {
          apps: [],
          builds: {},
          backups: {},
          preferences: {},
          buildPreferences: {},
          ui: { theme: "dark" },
          updates: {},
          launches: {},
          auto: false,
          autoSource: false,
        },
        job = { busy: false, stage: "", detail: "", log: "", outcome: "" };
      let current = "all",
        selected = "wordcraft",
        query = "",
        category = "all",
        managerAvailable = false,
        firstSnapshot = true,
        showUpdates = false,
        running = new Set(),
        appFolderDraft = "",
        settingsTab = "general";
      let lastCatalog = "",
        lastDetail = "",
        lastJob = "";
      const icons = {
        grid: '<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/>',
        box: '<path d="m12 3 9 5v8l-9 5-9-5V8z"/><path d="m3 8 9 5 9-5M12 13v8M7.5 5.5l9 5"/>',
        check: '<path d="m5 12 4 4L19 6"/>',
        download: '<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',
        build:
          '<path d="m14 6 4-4a7 7 0 0 1-8 9L4 17a2 2 0 0 0 3 3l6-6a7 7 0 0 0 9-8l-4 4z"/>',
        activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
        folder: '<path d="M3 7V4h6l2 3h10v13H3z"/>',
        search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
        settings:
          '<path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3z"/><circle cx="12" cy="12" r="3"/>',
        external: '<path d="M14 3h7v7m0-7-10 10M10 3H3v18h18v-7"/>',
        refresh: '<path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/>',
        arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
        code: '<path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/>',
        play: '<path d="M7 4v16l13-8z"/>',
        x: '<path d="M6 6l12 12M18 6 6 18"/>',
        minus: '<path d="M5 12h14"/>',
      };
      function icon(name) {
        return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.box}</svg>`;
      }
      function decorate() {
        document
          .querySelectorAll("[data-icon]")
          .forEach((e) => (e.innerHTML = icon(e.dataset.icon)));
      }
      function esc(v) {
        return String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function send(action, extra = {}) {
        if (window.ipc)
          window.ipc.postMessage(
            JSON.stringify({ action, app: selected, ...extra }),
          );
        else console.log(action, extra);
      }
      function installed(id) {
        return state.apps.find((a) => a.name === id && a.path);
      }
      function app(id) {
        return catalog.find((a) => a.id === id);
      }
      // Latest-release check for the installed version, if one has run.
      function check(id) {
        return installed(id) && (state.updates || {})[id];
      }
      function newer(id) {
        return check(id)?.latest || "";
      }
      function ago(seconds) {
        if (!seconds) return "";
        const m = Math.round((Date.now() / 1000 - seconds) / 60);
        if (m < 1) return "just now";
        if (m < 60) return `${m} min ago`;
        if (m < 60 * 24) return `${Math.round(m / 60)} h ago`;
        return `${Math.round(m / 60 / 24)} d ago`;
      }
      // Sidebar order stays fixed so ⌘1–⌘9 always open the same app.
      function installedApps() {
        return catalog.filter((a) => installed(a.id));
      }
      function recentFirst(list) {
        const at = (a) => (state.launches || {})[a.id] || 0;
        return [...list].sort((x, y) => at(y) - at(x));
      }
      function launch(id) {
        if (!installed(id)) return choose(id);
        selected = id;
        lastDetail = "";
        send("launch", { app: id });
        render();
      }
      function isRunning(id) {
        return running.has(id);
      }
      // GitHub notes are mostly "* Title by @user in https://…/pull/1"; keep the titles.
      function noteItems(text) {
        const items = [];
        for (const raw of String(text || "").split(/\r?\n/)) {
          const m = raw.trim().match(/^[*-]\s+(.*)$/);
          if (!m) continue;
          const item = m[1]
            .replace(/\s+by @[\w-]+(\[bot\])? in https?:\/\/\S+$/, "")
            .replace(/\s+in https?:\/\/\S+$/, "")
            .replace(/\*\*|__|`/g, "")
            .trim();
          if (!item || /^@[\w-]+ made their first contribution/i.test(item)) continue;
          items.push(item);
        }
        return items;
      }
      function notesBlock(version, text) {
        const items = noteItems(text);
        const shown = items.slice(0, 6);
        const body = shown.length
          ? `<ul>${shown.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>${items.length > shown.length ? `<div class="more">and ${items.length - shown.length} more</div>` : ""}`
          : `<p class="build-note">${esc(String(text).replace(/^#+\s*/gm, "").slice(0, 600))}</p>`;
        return `<details class="notes" open><summary>What’s new in ${esc(version)}</summary>${body}<button class="link" onclick="send('release-notes')">Full release notes on GitHub</button></details>`;
      }
      let menuActions = [];
      function contextMenu(event, id) {
        event.preventDefault();
        choose(id);
        const a = app(id),
          i = installed(id),
          latest = newer(id);
        const items = i
          ? [
              ["Open", () => launch(id)],
              latest && [`Update to ${latest}`, () => confirmAction("install-latest")],
              ["Show in Finder", () => send("open-app")],
              i.install_kind === "installer" && state.installFolder && i.path !== state.installFolder && ["Move to app folder", () => confirmMoveApp()],
              ["Check for update", () => send("check-release")],
              state.builds[id] && ["Open local build", () => send("launch-build")],
              "-",
              ["Uninstall…", () => confirmAction("uninstall")],
            ]
          : [
              ["Install", () => confirmAction("install-latest")],
              state.builds[id] && ["Open local build", () => send("launch-build")],
              ["View on GitHub", () => send("repository")],
            ];
        menuActions = [];
        const html = items
          .filter(Boolean)
          .map((item) => {
            if (item === "-") return '<div class="ctx-rule"></div>';
            menuActions.push(item[1]);
            const busy = job.busy && !["Open", "Show in Finder", "View on GitHub", "Open local build"].includes(item[0]);
            return `<button role="menuitem"${busy ? " disabled" : ""} onclick="runMenu(${menuActions.length - 1})">${esc(item[0])}</button>`;
          })
          .join("");
        const menu = document.getElementById("ctx");
        menu.innerHTML = `<div class="ctx-title">${esc(a.name)}</div>${html}`;
        menu.hidden = false;
        const { innerWidth: w, innerHeight: h } = window;
        const r = menu.getBoundingClientRect();
        menu.style.left = `${Math.min(event.clientX, w - r.width - 8)}px`;
        menu.style.top = `${Math.min(event.clientY, h - r.height - 8)}px`;
        menu.querySelector("button:not([disabled])")?.focus();
      }
      function closeMenu() {
        const menu = document.getElementById("ctx");
        if (menu) menu.hidden = true;
      }
      function runMenu(n) {
        closeMenu();
        menuActions[n]?.();
      }
      // Arrow keys move through the cards in reading order; up and down jump a row.
      function moveSelection(key) {
        const cards = [...document.querySelectorAll("#grid .app-card")];
        if (!cards.length) return;
        const at = Math.max(0, cards.findIndex((c) => c.dataset.id === selected));
        const columns = cards.filter((c) => c.offsetTop === cards[0].offsetTop).length || 1;
        const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns, ArrowDown: columns }[key];
        const next = cards[Math.min(cards.length - 1, Math.max(0, at + step))];
        choose(next.dataset.id);
        const card = document.querySelector(`#grid .app-card[data-id="${next.dataset.id}"]`);
        card?.focus();
        card?.scrollIntoView({ block: "nearest" });
      }
      function eventTitle(entry) {
        const name = app(entry.app)?.name || "";
        // [done, verb] so a failure can read "Couldn't install WordCraft".
        const titles = {
          "install-latest": ["Installed", "install", name],
          "update-all": ["Updated", "update", "apps"],
          "auto-update": ["Updated", "update", "apps automatically"],
          "install-selected": ["Installed", "install", "selected apps"],
          "install-build": ["Installed", "install", `${name} from a local build`],
          build: ["Built", "build", name],
          setup: ["Set up", "set up", `build tools for ${name}`],
          uninstall: ["Uninstalled", "uninstall", name],
          restore: ["Restored", "restore", name],
          "delete-backup": ["Deleted", "delete", `a backup of ${name}`],
          "delete-build": ["Deleted", "delete", `a build of ${name}`],
          "move-app": ["Moved", "move", name],
          "move-apps": ["Moved", "move", "apps"],
          "move-library": ["Moved", "move", "the library"],
          "clean-builds": ["Cleaned up", "clean up", "build caches"],
          "clear-backups": ["Deleted", "delete", "backups"],
          "clear-downloads": ["Cleared", "clear", "downloads"],
          "check-updates": ["Checked", "check", "for updates"],
          "check-release": ["Checked", "check", `${name} for updates`],
          "check-source": ["Checked", "check", `${name} source`],
          "fetch-sources": ["Fetched", "fetch", "sources"],
        };
        const [done, verb, what] = titles[entry.action] || ["Ran", "run", entry.action || "an operation"];
        if (entry.stage === "Failed") return `Couldn’t ${verb} ${what}`;
        if (entry.stage === "Cancelled") return `Stopped: ${verb} ${what}`;
        return `${done} ${what}`;
      }
      function eventRow(entry) {
        const failed = entry.stage === "Failed";
        const cancelled = entry.stage === "Cancelled";
        const mark = failed ? icon("x") : cancelled ? icon("minus") : icon("check");
        const lines = (entry.lines || []).map((l) => `<li>${esc(l)}</li>`).join("");
        return `<div class="event${failed ? " failed" : ""}"><span class="event-icon">${mark}</span><div class="event-body"><div class="event-head"><strong>${esc(eventTitle(entry))}</strong><span class="tiny">${ago(entry.time)}</span></div>${lines ? `<ul>${lines}</ul>` : ""}${failed && entry.error ? `<div class="event-error">${esc(entry.error)}</div>` : ""}</div></div>`;
      }
      function versionLine(id) {
        const i = installed(id);
        if (!i) return '<span class="version-line">Available</span>';
        const c = check(id);
        if (c?.latest)
          return `<span class="version-line" title="Update available"><span class="status-dot new"></span>${esc(i.version)} → <span class="new">${esc(c.latest)}</span></span>`;
        return `<span class="version-line"><span class="status-dot"></span>${esc(i.version)}${c ? " · Up to date" : ""}</span>`;
      }
      function toast(text) {
        const e = document.getElementById("toast");
        e.innerHTML = "";
        const t = document.createElement("span");
        t.textContent = text;
        const b = document.createElement("button");
        b.textContent = "×";
        b.setAttribute("aria-label", "Dismiss message");
        b.onclick = () => e.classList.remove("show");
        e.append(t, b);
        e.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => e.classList.remove("show"), 6000);
      }
      function theme(value, persist = true) {
        document.documentElement.dataset.theme = value;
        document
          .querySelectorAll(".themes [data-theme]")
          .forEach((e) =>
            e.classList.toggle("active", e.dataset.theme === value),
          );
        if (persist) send("theme", { theme: value });
      }
      function view(value) {
        current = value;
        query = "";
        category = "all";
        lastCatalog = "";
        render();
      }
      function choose(id) {
        selected = id;
        lastDetail = "";
        render();
      }
      function disabled() {
        return job.busy ? " disabled" : "";
      }
      function nav() {
        const updates = installedApps().filter((a) => newer(a.id)).length;
        document.getElementById("nav").innerHTML = [
          ["installed", "play", "My apps", installedApps().length],
          ["all", "grid", "All apps", catalog.length],
          ["builds", "build", "Builds", Object.keys(state.builds).length],
          ["activity", "activity", "Activity", ""],
        ]
          .map(
            ([id, sym, label, count]) =>
              `<button class="${current === id ? "active" : ""}" onclick="view('${id}')">${icon(sym)}${label}<span class="count">${id === "installed" && updates ? `<span class="update-dot" style="display:inline-block;margin-right:6px" title="${updates} update${updates === 1 ? "" : "s"} available"></span>` : ""}${count}</span></button>`,
          )
          .join("");
        document.getElementById("side-apps").innerHTML =
          installedApps()
            .map(
              (a, n) =>
                `<div class="side-app ${selected === a.id ? "active" : ""}" data-id="${a.id}" oncontextmenu="contextMenu(event,'${a.id}')" role="button" tabindex="0" title="Double-click to open ${a.name}" onclick="choose('${a.id}')" ondblclick="launch('${a.id}')" onkeydown="if(event.key==='Enter')launch('${a.id}')"><img src="${a.icon}" alt=""><span class="name">${a.name}</span>${isRunning(a.id) ? '<span class="run-dot" title="Running"></span>' : ""}${newer(a.id) ? `<span class="update-dot" title="Update available: ${esc(newer(a.id))}"></span>` : ""}${n < 9 ? `<span class="shortcut">⌘${n + 1}</span>` : ""}<button class="open" aria-label="Open ${a.name}" onclick="event.stopPropagation();launch('${a.id}')">Open</button></div>`,
            )
            .join("") ||
          '<p class="tiny" style="padding:10px">Your installed apps appear here.</p>';
      }
      function render() {
        nav();
        document.getElementById("tab-label").textContent = {
          all: "All apps",
          installed: "My apps",
          builds: "Builds",
          activity: "Activity",
        }[current];
        let key = JSON.stringify([
          current,
          state.apps,
          state.builds,
          state.updates,
          state.launches,
          state.activity,

            keepSourceBackups: checked("source-backups"),
            backupVersions: Number(document.getElementById("retention").value),
            checkInstalledAppsOnStartup: checked("startup-apps"),
            selectedApps: selection,
            selectedSources: [...document.querySelectorAll(".selected-source:checked")].map((e) => e.value),
          },
          buildPreferences: {
            ...state.buildPreferences,
            deleteCacheAfterSuccess: checked("delete-cache"),
            deleteWorkspaceAfterSuccess: checked("delete-workspace"),
          },
          sparkleChecks: checked("sparkle-checks"),
          sparkleDownloads: checked("sparkle-downloads"),
          auto: checked("hourly-apps"),
          autoSource: checked("hourly-sources"),
          startAtLogin: checked("start-at-login"),
        });
        closeModal();
        if (mode !== "portable" && installFolder !== before)
          confirmMoveApps(installFolder || "/Applications");
      }
      function confirmUpdateAll() {
        const waiting = installedApps().filter((a) => newer(a.id));
        modal(
          `Update ${waiting.length} app${waiting.length === 1 ? "" : "s"}`,
          `<p>These apps are updated one after another from their official Mac releases. Close them first. Previous versions are backed up according to your settings.</p><div class="updates" style="margin-top:14px">${waiting.map((a) => `<div class="update-row" style="cursor:default"><img src="${a.icon}" alt=""><span>${a.name}</span><span class="versions">${esc(installed(a.id).version)} → <span class="new">${esc(newer(a.id))}</span></span><span></span></div>`).join("")}</div>`,
          `<button class="primary" onclick="send('update-all');closeModal();view('activity')">Update all</button>`,
        );
      }
      function confirmSelected() {
        modal(
          "Install selected apps",
          `<p>Install or update ${(state.preferences.selectedApps || []).length} selected apps using official Mac releases, with source builds when needed.</p>`,
          `<button class="primary" onclick="send('install-selected');closeModal();view('activity')">Continue</button>`,
        );
      }
      window.receive = function (event) {
        if (event.type === "snapshot") {
          state = event.data;
          theme(state.ui.theme, false);
          if (firstSnapshot) {
            firstSnapshot = false;
            const mine = recentFirst(installedApps());
            if (mine.length) {
              current = "installed";
              if (!installed(selected)) selected = mine[0].id;
            }
          }
          lastCatalog = "";
          render();
        } else if (event.type === "job") {
          const previous = job;
          job = event.data;
          if (previous.busy && !job.busy && job.stage === "Failed")
            toast(job.outcome || job.detail);
          render();
          if (current === "activity") {
            const stage = document.getElementById("now-stage");
            if (stage) {
              stage.textContent = job.stage || "Working";
              document.getElementById("now-detail").textContent = job.detail || "";
            }
            const e = document.getElementById("log");
            if (e && lastJob !== job.log) {
              e.textContent = job.log || "Ready.";
              e.scrollTop = e.scrollHeight;
              lastJob = job.log;
            }
          }
        } else if (event.type === "feedback") toast(event.message);
        else if (event.type === "launch-settings") {
          const save = event.build ? "save-build-launch-settings" : "save-launch-settings";
          modal(
            event.build ? "Build launch options" : "Launch settings",
            `<p>${event.build ? "Used when you open the local build. Your installed app keeps its own settings. " : ""}One argument per line. Leave empty to use the default launch options.</p><textarea id="launch-arguments">${esc(event.settings.arguments.join("\n"))}</textarea>`,
            `<button class="primary" onclick="send('${save}',{arguments:document.getElementById('launch-arguments').value});closeModal()">Save</button>`,
          );
        } else if (event.type === "disk-usage") {
          showUsage(event.parts);
        } else if (event.type === "folder-chosen") {
          folderChosen(event.purpose, event.path);
        } else if (event.type === "running") {
          running = new Set(event.apps);
          render();
        }
      };
      document.addEventListener("mousedown", (e) => {
        if (!e.target.closest("#ctx")) closeMenu();
      });
      window.addEventListener("blur", closeMenu);
      document.getElementById("drag").onmousedown = (e) => {
        if (e.button === 0) send("drag");
      };
      document.getElementById("drag").ondblclick = () => send("maximize");
      document.addEventListener("keydown", (e) => {
        const menu = document.getElementById("ctx");
        if (!menu.hidden) {
          if (e.key === "Escape") return closeMenu();
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            const items = [...menu.querySelectorAll("button:not([disabled])")];
            const at = items.indexOf(document.activeElement);
            items[(at + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length]?.focus();
          }
          return;
        }
        if (e.key === "Escape") return closeModal();
        if (document.querySelector(".modal")) return;
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
        const grid = current === "all" || current === "installed";
        if (grid && /^Arrow/.test(e.key) && (!typing || (e.target.id === "search" && e.key === "ArrowDown"))) {
          e.preventDefault();
          moveSelection(typing ? "ArrowRight" : e.key);
          return;
        }
        if (e.key === "Enter" && e.target === document.body) {
          e.preventDefault();
          launch(selected);
          return;
        }
        if ((e.metaKey && e.key === "k") || (e.key === "/" && !typing)) {
          e.preventDefault();
          if (current !== "all" && current !== "installed") view("installed");
          document.getElementById("search")?.focus();
        } else if (e.metaKey && /^[1-9]$/.test(e.key)) {
          const a = installedApps()[Number(e.key) - 1];
          if (a) {
            e.preventDefault();
            launch(a.id);
          }
        } else if (e.metaKey && e.key === "o") {
          e.preventDefault();
          launch(selected);
        }
      });
      theme("dark", false);
      render();
      send("ready");
    </script>
  </body>
</html>
